name = "amsterdam-uv-index-bot"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[triggers]
# Morning briefing at 7:00 Amsterdam (5:00 UTC) — full Google + OpenUV.
# Rain + wind via Open-Meteo (free) every 5 min.
# Google publicAlerts every 30 min — keeps Google usage well under 10K/month free tier.
crons = ["0 5 * * *", "*/5 * * * *", "*/30 * * * *"]

[[kv_namespaces]]
binding = "RAIN_STATE"
id = "6a9f81f79f614f49b9f6832cdaf073ee"

[[kv_namespaces]]
binding = "WIND_STATE"
id = "517f0af0d3394c199df0b8b350e5d396"

[[kv_namespaces]]
binding = "ALERT_STATE"
id = "687ada18489146d7bb05cc8db295dbb3"


# Environment variables are now loaded from .env file
# The following variables are required:
# - TELEGRAM_BOT_TOKEN
# - CHAT_ID
# - OPENUV_API_KEY
# - LATITUDE
# - LONGITUDE
# - GOOGLE_WEATHER_API_KEY